[versions]
slf4j = "1.7.25"
jetty = "11.0.26"
jackson = "2.9.8"

[libraries]
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
slf4j-api = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

jetty-bom = { group = "org.eclipse.jetty", name = "jetty-bom", version.ref = "jetty" }

commons-io = { group = "commons-io", name = "commons-io", version = "1.4" }

jackson-bom = { group = "com.fasterxml.jackson", name = "jackson-bom", version.ref = "jackson" }

junit = { group = "junit", name = "junit", version = "4.13.2" }
hamcrest-library = { group = "org.hamcrest", name = "hamcrest-library", version = "1.3" }
hamkrest-json = { group = "org.araqnid.hamkrest", name = "hamkrest-json", version = "1.1.2" }
mockito-core = { group = "org.mockito", name = "mockito-core", version = "2.28.2" }

[bundles]
junit = ["junit", "hamcrest-library", "hamkrest-json", "mockito-core"]
